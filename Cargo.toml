[package]
name = "signal-core"
version = "0.1.0"
edition = "2021"
description = "Domain-agnostic signal-processing primitives (FFT, windowing, filtering, peak detection, resampling), shared across audio and time-series applications via native Rust or WASM."
license = "MIT OR Apache-2.0"
keywords = ["dsp", "fft", "signal-processing", "wasm", "filtering"]
categories = ["algorithms", "science", "wasm"]
# Set `repository` once this is pushed to its actual public git host.

[lib]
name = "signal_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustfft = "6"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = []
console_error_panic_hook = ["dep:console_error_panic_hook"]

[profile.release]
opt-level = 3
lto = true
